<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Update</h1>

    <!--form 태그로 데이터 전송 시 method 설정-->
    <!-- get : 조회, 삭제(delete)-->
    <!-- post : 추가, 수정(put, patch), 로그인(사용자의 중요한 정보를 담아서 요청하는 경우)-->
    <form action="http://localhost:3000/update" method="post">
        ID : <input name="id">
        <br>
        PW : <input name="newPw">
        <br>
        NICK : <input name="newNick">
        <button>정보 수정</button>
    </form>

</body>
</html>
